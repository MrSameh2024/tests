<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIV Reading Vocabulary | Smart Students Hub</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f4f6fb;color:#14244a;margin:0}header{background:linear-gradient(115deg,#14244a,#8c2f52);color:white;padding:30px max(20px,calc((100% - 1100px)/2))}header h1{margin:8px 0}main{max-width:1100px;margin:auto;padding:20px}a{color:inherit}nav a{display:inline-block;background:#fff;color:#14244a;padding:10px;border-radius:9px;margin:4px}section{background:#fff;border-radius:18px;padding:20px;margin:22px 0;box-shadow:0 3px 14px #14244a15}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:12px;padding:14px}.ar{direction:rtl;color:#8c2f52;font-size:18px;margin:10px 0}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#8c2f52;color:#fff;font-weight:700;margin:4px}button:focus-visible{outline:3px solid #d8a93a}.option{background:#f1e9ee;color:#14244a;border:1px solid #ddd}.option[aria-pressed=true]{background:#8c2f52;color:#fff}.question{padding:12px 0;border-bottom:1px solid #eee}.result{font-weight:bold;padding:14px}.muted{color:#59677b}</style><header><a href="https://smartstudentshub.com/ielts/viv-for-ielts/">← VIV for IELTS Hub</a><h1>📖 Reading Vocabulary</h1><p>100 words · 10 groups · English–Arabic · Pronunciation · Self-check quizzes</p><p dir="rtl">مفردات القراءة — ١٠ مجموعات مع النطق والاختبارات</p></header><main><nav id="nav"></nav><div id="groups"></div></main><script>const DATA=[["Passage","مقطع"],["Paragraph","فقرة"],["Headings","عناوين"],["Skimming","التصفح السريع"],["Scanning","البحث السريع"],["Summary","ملخص"],["Main idea","الفكرة الرئيسية"],["Supporting detail","تفصيل داعم"],["Inference","استنتاج"],["Conclusion","خاتمة"],["Fact","حقيقة"],["Opinion","رأي"],["True","صحيح"],["False","خطأ"],["Not given","غير مذكور"],["Sentence completion","إكمال الجملة"],["Word limit","الحد الأقصى للكلمات"],["Synonym","مرادف"],["Antonym","مضاد"],["Highlight","تسليط الضوء"],["Context","السياق"],["Vocabulary","مفردات"],["Author’s view","وجهة نظر الكاتب"],["Reference","مرجع"],["Evidence","دليل"],["Data","بيانات"],["Statistics","إحصائيات"],["Research","بحث"],["Compare","يقارن"],["Contrast","يوضح التباين"],["Identify","يحدد"],["Match","يطابق"],["List","قائمة"],["Table","جدول"],["Diagram","رسم توضيحي"],["Flowchart","مخطط تدفق"],["Label","تسمية"],["Number","رقم"],["Choose","يختار"],["Locate","يحدد موقع"],["Understanding","فهم"],["Argument","حجة"],["Problem","مشكلة"],["Solution","حل"],["Cause","سبب"],["Effect","نتيجة"],["Keywords","كلمات مفتاحية"],["Title","عنوان"],["Idea flow","تسلسل الأفكار"],["Topic sentence","الجملة الموضوعية"],["Tone","نبرة"],["Style","أسلوب"],["Definition","تعريف"],["Category","فئة"],["Purpose","هدف"],["Description","وصف"],["Reference word","كلمة مرجعية"],["Academic text","نص أكاديمي"],["Natural science","العلوم الطبيعية"],["Social science","العلوم الاجتماعية"],["Humanities","العلوم الإنسانية"],["Journal article","مقالة علمية"],["Editorial","افتتاحية"],["Biography","سيرة ذاتية"],["Process","عملية"],["Classification","تصنيف"],["Selection","اختيار"],["Matching headings","مطابقة العناوين"],["Matching information","مطابقة المعلومات"],["Matching features","مطابقة الخصائص"],["Matching sentence endings","مطابقة نهايات الجمل"],["Fill in gaps","ملء الفراغات"],["Sentence insertion","إدراج جملة"],["Table completion","إكمال الجدول"],["Summary completion","إكمال الملخص"],["Information retrieval","استخراج المعلومات"],["Paraphrasing","إعادة الصياغة"],["Reading speed","سرعة القراءة"],["Time management","إدارة الوقت"],["Logical order","الترتيب المنطقي"],["Contradiction","تناقض"],["Agreement","توافق"],["Text structure","بنية النص"],["Interpret","يفسر"],["Analyze","يحلل"],["Evaluate","يقيم"],["Distinguish","يميز"],["Extract","يستخرج"],["Connect","يربط"],["Survey","يمسح"],["Thesis","أطروحة"],["Note","ملاحظة"],["Summary sentence","جملة ملخصة"],["Selection","اختيار"],["Not Given","غير مذكور"],["Classification task","مهمة تصنيف"],["Multiple matching","مطابقة متعددة"],["Topic focus","تركيز الموضوع"],["Identify view","تحديد وجهة النظر"],["Evaluate answer","تقييم الإجابة"]];let choices={};let scores={};try{scores=JSON.parse(localStorage.getItem('viv-reading-scores')||'{}')}catch{};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('nav').innerHTML=Array.from({length:10},(_,g)=>'<a href="#g'+g+'">Group '+(g+1)+'</a>').join('');document.getElementById('groups').innerHTML=Array.from({length:10},(_,g)=>'<section id="g'+g+'"><h2>Group '+(g+1)+' <span class="muted">· Words '+(g*10+1)+'–'+(g*10+10)+'</span></h2><div class="cards">'+DATA.slice(g*10,g*10+10).map(([en,ar])=>'<div class="card"><strong>'+esc(en)+'</strong><p class="ar" lang="ar">'+esc(ar)+'</p><button type="button" data-speak="'+esc(en)+'">🔊 Listen</button></div>').join('')+'</div><div id="quiz'+g+'"><h3>Practice Test</h3><p>Five multiple-choice questions · خمسة أسئلة</p><button type="button" data-start="'+g+'">Start quiz · ابدأ الاختبار</button><p class="muted" id="best'+g+'">'+(scores[g]===undefined?'':'Best score: '+scores[g]+'/5')+'</p></div></section>').join('');document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-speak')){if(!('speechSynthesis'in window)){alert('Speech is unavailable in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.dataset.speak);u.lang='en-GB';u.rate=.83;speechSynthesis.speak(u)}if(b.hasAttribute('data-start'))start(+b.dataset.start);if(b.hasAttribute('data-pick')){let [g,q,a]=b.dataset.pick.split(':').map(Number);choices[g][q]=a;document.querySelectorAll('[data-pick^="'+g+':'+q+':"]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}if(b.hasAttribute('data-grade'))grade(+b.dataset.grade)});function start(g){let words=DATA.slice(g*10,g*10+10);let positions=[0,2,4,6,8];choices[g]={};let html=positions.map((p,q)=>{let correct=words[p][1];let options=[correct];for(let step=1;options.length<4;step++){let ar=words[(p+step*3)%10][1];if(!options.includes(ar))options.push(ar)}options=options.map((v,i)=>({v,sort:(i*7+q*3)%11})).sort((a,b)=>a.sort-b.sort).map(x=>x.v);return '<div class="question"><strong>'+(q+1)+'. '+esc(words[p][0])+'</strong><p>'+options.map((v,i)=>'<button type="button" class="option" aria-pressed="false" data-pick="'+g+':'+q+':'+i+'">'+esc(v)+'</button>').join('')+'</p></div>'});choices[g].correct=positions.map(p=>words[p][1]);choices[g].options=positions.map((p,q)=>{let correct=words[p][1],o=[correct];for(let step=1;o.length<4;step++){let ar=words[(p+step*3)%10][1];if(!o.includes(ar))o.push(ar)}return o.map((v,i)=>({v,sort:(i*7+q*3)%11})).sort((a,b)=>a.sort-b.sort).map(x=>x.v)});document.getElementById('quiz'+g).innerHTML='<h3>Group '+(g+1)+' Practice Test</h3>'+html.join('')+'<button data-grade="'+g+'">Check answers · تحقق من الإجابات</button><div class="result" id="result'+g+'" aria-live="polite"></div>'}function grade(g){let c=choices[g];let n=0;let explanations=[];for(let q=0;q<5;q++){let selected=c.options[q][c[q]];if(selected===c.correct[q])n++;explanations.push((q+1)+'. '+esc(c.correct[q])+(selected===undefined?' (not answered)':''))}scores[g]=Math.max(scores[g]||0,n);try{localStorage.setItem('viv-reading-scores',JSON.stringify(scores))}catch{}document.getElementById('result'+g).innerHTML='Score: '+n+'/5 · '+(n===5?'Excellent!':'Review and retry.')+'<p>'+explanations.join(' · ')+'</p><button data-start="'+g+'">Try again</button>'}</script></html>
